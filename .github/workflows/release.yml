name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-linux-smoke.sh"
      - "scripts/release-std-smoke.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (for example v0.20.24)
        required: true
        type: string
      dry_run:
        description: Build and smoke without publishing a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  binaries:
    name: Self-contained binaries
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Read the package version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package version ${version}"

      - name: Require the tag to match mix.exs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          tag="${tag#refs/tags/}"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag ${tag} does not match mix.exs version ${version} (expected ${expected})"
            exit 1
          fi
          echo "building ${expected}"

      - uses: jdx/mise-action@v4

      - name: Install zig 0.15.2 and xz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils
          case "$(uname -m)" in
            x86_64) zarch=x86_64 ;;
            aarch64|arm64) zarch=aarch64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.15.2/zig-${zarch}-linux-0.15.2.tar.xz"
          curl -fsSL -o /tmp/zig.tar.xz "$url"
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${zarch}-linux-0.15.2" >> "$GITHUB_PATH"
          "/tmp/zig-${zarch}-linux-0.15.2/zig" version

      - name: Fetch the release dependencies
        run: MIX_ENV=burrito mix deps.get

      - name: Build the four targets
        run: MIX_ENV=burrito mix release

      - name: Name the assets
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          mkdir -p dist
          name_one() {
            src="$1"
            dest="muro-${version}-$2"
            test -f "$src"
            cp "$src" "dist/${dest}"
            chmod 0755 "dist/${dest}"
            (cd dist && sha256sum "${dest}" > "${dest}.sha256")
          }
          name_one burrito_out/muro_macos_aarch64 macos-aarch64
          name_one burrito_out/muro_macos_x86_64 macos-x86_64
          name_one burrito_out/muro_linux_x86_64 linux-x86_64
          name_one burrito_out/muro_linux_aarch64 linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: muro-binaries
          path: dist/*

  smoke:
    name: Smoke the Linux binaries
    needs: binaries
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      # Check out the workflow commit, not a rebuilt tag, so older tags
      # still get scripts/release-linux-smoke.sh.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: muro-binaries
          path: dist

      - name: Smoke the matching Linux binary
        run: bash scripts/release-linux-smoke.sh dist

  release:
    name: Publish the GitHub release
    needs: [smoke, binaries]
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muro-binaries
          path: dist

      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo apt-get update
          if sudo apt-get install -y gh; then
            gh --version
            exit 0
          fi
          tmp=$(mktemp -d)
          case "$(uname -m)" in
            x86_64) garch=amd64 ;;
            aarch64|arm64) garch=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$tmp/gh.tgz" \
            "https://github.com/cli/cli/releases/download/v2.81.0/gh_2.81.0_linux_${garch}.tar.gz"
          tar -xzf "$tmp/gh.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp"/gh_*/bin/gh /usr/local/bin/gh
          gh --version

      - name: Attach the assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.binaries.outputs.version }}"
          test -n "$version"
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Muro ${version}"
          fi
          gh release upload "$tag" dist/* --clobber
