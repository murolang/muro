# Language manual for muro-lang.dev and for agents.
# This is not ExDoc. Elixir API docs, when added, live in mix.exs `docs:`.
# Agda is a third layer: the judgments in agda/Muro.

source: murolang/muro
path: manual

pages:
  - file: index.md
    slug: index
    title: Manual
    summary: What Muro is, how to read this book, and the three documentation layers.
  - file: start.md
    slug: start
    title: Start
    summary: Install, write a .muro file, check it, emit Elixir.
  - file: marks.md
    slug: marks
    title: Marks
    summary: Π, λ, modes, data, atoms, and streams, one paragraph each.
  - file: wall.md
    slug: wall
    title: The wall
    summary: spec, evidence, and run. Promotion is forbidden.
  - file: language.md
    slug: language
    title: Terms
    summary: Type, Π, λ, match, quantities, and the book.
  - file: sessions.md
    slug: sessions
    title: Sessions
    summary: A session is the protocol two processes follow.
  - file: identity.md
    slug: identity
    title: Identity
    summary: Equations, refl, rewrite, and explicit motives.
  - file: data.md
    slug: data
    title: Data
    summary: Inductive types, positivity, Maybe, List, Tree.
  - file: indexed.md
    slug: indexed
    title: Indexed data
    summary: Fin, Vec, and lookup without a runtime bounds check.
  - file: streams.md
    slug: streams
    title: Streams
    summary: ν, unfold, Always, and bisimulation.
  - file: either.md
    slug: either
    title: Either and Dec
    summary: Disjoint union and decisions. Not LEM.
  - file: machine.md
    slug: machine
    title: Machine numbers
    summary: I64, F32, Tensor, and Nx. Nat stays Peano.
  - file: emit.md
    slug: emit
    title: Emit
    summary: What becomes Elixir. C and Rust print the closed run. A Nat run is a NIF. Cortex-M prints a Nat run. OTP writes a conforming process. A cross is one call on a named node. Spec and evidence are omitted from a run.
  - file: exunit.md
    slug: exunit
    title: Closed equations as tests
    summary: A book's closed equations become one ExUnit module. The tests call an implementation the host names. A skip is printed and recorded.
  - file: gen.md
    slug: gen
    title: Committed modules
    summary: A manifest names each book, module, and target. mix muro.gen writes the module. mix muro.gen --check fails when the file and the book disagree.
  - file: repr.md
    slug: repr
    title: Host representations
    summary: A repr states the host shape of a data type. Emit writes strict decode and encode.
  - file: packages.md
    slug: packages
    title: Packages
    summary: Import a book from a git or Hex package at the version muro.lock records.
  - file: grammar.md
    slug: grammar
    title: Grammar
    summary: The surface grammar lib/muro/parser.ex implements.
  - file: examples.md
    slug: examples
    title: Examples
    summary: Every file in examples/ and what it is for.
  - file: cshrl.md
    slug: cshrl
    title: CSHRL
    summary: Coinductive symmetric homomorphisms for RL, as a library on params, with three environments and their agents.
  - file: for-agents.md
    slug: for-agents
    title: For agents
    summary: Two jobs. Do not mix them. Commands and file map.
  - file: extending.md
    slug: extending
    title: Extending the kernel
    summary: How to change the type theory. Agda first, then Elixir.
  - file: limits.md
    slug: limits
    title: Limits
    summary: What the language does not do. Facts about the checker, not a roadmap.
